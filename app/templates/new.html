{% extends 'base.html' %}{% block content %}<a href="/">← Back to workspace</a><section class="card narrow"><span class="eyebrow">WE’RE HERE TO HELP</span><h1>Raise a ticket</h1><form method="post" action="/tickets"><input type="hidden" name="token" value="{{csrf}}"><label>Title<input name="title" required minlength="3" maxlength="150" placeholder="A short summary of the issue"></label><label>Priority<select name="priority">{% for p in priorities %}<option {% if p=='Medium' %}selected{% endif %}>{{p}}</option>{% endfor %}</select></label><label>Description<textarea name="description" required minlength="10" maxlength="10000" rows="8" placeholder="What happened? What did you expect? Include steps to reproduce."></textarea></label><button>Create ticket →</button></form></section>{% endblock %}
